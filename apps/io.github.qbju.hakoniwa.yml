summary: OSSのAndroidアプリを日本語で探せるHakoniwa公式クライアント
description: |
  Hakoniwaに収録されたオープンソースのAndroidアプリを、日本語で探してインストール・更新できる公式クライアントです。
  アプリ一覧は署名を確認してから読み込み、APKもSHA-256を照合してからインストールします。
  検索、カテゴリ、新着・更新順の並べ替えに加え、「マイアプリ」で入れたアプリの更新・まとめて更新・削除ができます。
