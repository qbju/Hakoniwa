plugins {
    id "com.android.application"
}

def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "io.github.qbju.hakoniwa"
    compileSdk 35
    buildToolsVersion = "35.0.0"

    defaultConfig {
        applicationId "io.github.qbju.hakoniwa"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            vcsInfo { include false }
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
