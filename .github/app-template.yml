# apps/<パッケージ名>.yml として保存してPRを出してください
name: アプリ名                       # 必須（タイトル、50文字以内）
package: com.example.app            # APKのパッケージ名（ファイル名と同じ）
repo: owner/repository              # GitHubのソースリポ
license: GPL-3.0-only               # SPDX ID（リポのLICENSEと一致すること）
apk: '-arm64-v8a-release\.apk$'     # Release資産のうち収録するAPKに1つだけ一致する正規表現
signer: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # 署名証明書のSHA-256（apksigner verify --print-certs）
summary: 80文字以内の一言説明        # 必須
description: |                      # 必須（30文字以上）
  どんなアプリか、主な機能などを具体的に
screenshots:                        # 必須（2〜8枚、apps/<パッケージ名>/screenshots/ に置いたPNG/JPEG）
  - 01.png
  - 02.png
# アイコン: APK内のアイコンがベクター（アダプティブ）のみで表示されない場合は apps/<パッケージ名>/icon.png（正方形PNG・48〜1024px）を置いてください（任意）
categories: [Internet]              # Connectivity, Development, Games, Internet, Security, System など
author: 作者名                      # 必須（同じGitHubアカウントのアプリは同じ作者名に）
website: https://example.com        # 任意（公式サイト）
anti_features: []                   # 該当すれば NonFreeNet, Tracking, Ads など（任意）
# prerelease: true                  # プレリリースも収録する場合（任意）
