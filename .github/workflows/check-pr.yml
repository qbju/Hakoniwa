name: check-pr

# pull_request_target: ベースブランチのスクリプトで検証する。PR側のコードは実行しない。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["apps/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # ベース（main）をチェックアウト
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate app definitions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && python check_pr.py "${{ github.repository }}" "${{ github.event.pull_request.number }}"
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=scripts/check-result.md
          test -f "$f" || echo "チェックを実行できませんでした。Actionsのログを見てください。" > "$f"
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body-file "$f" --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body-file "$f"
